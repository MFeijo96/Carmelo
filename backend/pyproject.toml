[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "home-financial-backend"
version = "0.1.0"
description = "Local API and CrewAI runtime scaffold for Home Financial"
requires-python = ">=3.11"
dependencies = [
    "crewai>=0.100,<2",
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.6,<3",
    "pyyaml>=6,<7",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.10,<2",
    "pytest>=9.0.3,<10",
    "ruff>=0.9,<1",
    "types-pyyaml>=6,<7",
]
firestore = [
    "google-cloud-firestore>=2.19,<3",
]

[project.scripts]
home-financial-api = "home_financial_backend.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
home_financial_backend = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "src"