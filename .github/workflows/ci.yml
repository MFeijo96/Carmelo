name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      FIREBASE_PROJECT_ID: demo-home-financial
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra firestore
      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy src
      - name: Unit tests
        run: uv run pytest --ignore=tests/test_firestore_emulator.py
      - name: Golden-dataset evaluation (LLM disabled)
        run: uv run pytest tests/test_golden_evaluation.py tests/test_observability_and_performance.py
      - name: Integration tests against Firestore Emulator
        working-directory: .
        run: |
          npx --yes firebase-tools emulators:exec --only firestore --project "$FIREBASE_PROJECT_ID" \
            "cd backend && FIRESTORE_EMULATOR_HOST=127.0.0.1:8080 uv run pytest tests/test_firestore_emulator.py -rs"
      - name: Dependency audit
        # Accepted: unreachable ChromaDB server advisories pulled in by CrewAI (see project-context/2.build/security.md).
        run: |
          uv export --frozen --no-hashes --extra dev --extra firestore --no-emit-project > requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --no-deps --disable-pip \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check and build
        run: npm run build
      - name: Tests
        run: npm test
      - name: Dependency audit
        run: npm audit

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
